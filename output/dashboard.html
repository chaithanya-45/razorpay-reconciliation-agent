<html lang="en">
<head>

<title>ReconciliAI — Audit Report</title>
<style>

  :root {
    --ink: #1B2A4A;
    --ink-light: #2E4270;
    --paper: #F5F6F3;
    --paper-card: #FFFFFF;
    --line: #DCDDD6;
    --matched: #1D6B3E;
    --matched-bg: #E4F3EA;
    --exception: #B4560B;
    --exception-bg: #FCEEE0;
    --text-secondary: #5B5F6B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    padding: 40px 24px 80px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .subtitle { font-size: 14px; color: var(--text-secondary); }
  .tabs { display: flex; gap: 4px; margin: 28px 0 20px; border-bottom: 1px solid var(--line); }
  .tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px 18px;
    cursor: pointer;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    user-select: none;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px;
  }
  .stat-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-secondary); margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace;
  }
  .stat-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px; font-weight: 500;
  }
  .stat-value.matched { color: var(--matched); }
  .stat-value.exception { color: var(--exception); }
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-secondary); margin: 32px 0 12px;
  }
  .breakdown { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; padding: 5px 10px; border-radius: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .pill.matched { background: var(--matched-bg); color: var(--matched); }
  .pill.exception { background: var(--exception-bg); color: var(--exception); }
  table { width: 100%; border-collapse: collapse; background: var(--paper-card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  thead th {
    text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary);
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: #FAFAF8;
  }
  tbody td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FAFAF8; }
  .ref { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .amt { font-family: 'IBM Plex Mono', monospace; text-align: right; }
  .status-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500;
    padding: 3px 8px; border-radius: 4px; display: inline-block;
  }
  .status-badge.MATCHED { background: var(--matched-bg); color: var(--matched); }
  .status-badge.EXCEPTION { background: var(--exception-bg); color: var(--exception); }
  .detail { color: var(--text-secondary); font-size: 12px; max-width: 340px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--paper-card); cursor: pointer; color: var(--text-secondary);
  }
  .filter-btn.active { background: var(--ink); color: white; border-color: var(--ink); }
</style>
</head>

function render() {

    `<div class="tab ${i === currentBatch ? 'active' : ''}" data-idx="${i}">${b.label}</div>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { currentBatch = parseInt(t.dataset.idx); currentFilter = 'ALL'; render(); };
  });

  const batch = DATA.batches[currentBatch];
  const records = batch.records;
  const matched = records.filter(r => r.status === 'MATCHED');
  const exceptions = records.filter(r => r.status === 'EXCEPTION');
  const matchRate = (matched.length / records.length * 100).toFixed(1);

  const matchTypeCounts = {};
  matched.forEach(r => { matchTypeCounts[r.match_type] = (matchTypeCounts[r.match_type]||0) + 1; });
  const exceptionCounts = {};
  exceptions.forEach(r => { exceptionCounts[r.exception_reason] = (exceptionCounts[r.exception_reason]||0) + 1; });

  let filtered = records;
  if (currentFilter === 'MATCHED') filtered = matched;
  if (currentFilter === 'EXCEPTION') filtered = exceptions;

  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Total records</div>
        <div class="stat-value">${records.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Match rate</div>
        <div class="stat-value matched">${matchRate}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Matched</div>
        <div class="stat-value matched">${matched.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Exceptions</div>
        <div class="stat-value exception">${exceptions.length}</div>
      </div>
    </div>

    <div class="section-label">Match type breakdown</div>
    <div class="breakdown">
      ${Object.entries(matchTypeCounts).map(([k,v]) => `<div class="pill matched">${k}: ${v}</div>`).join('')}
    </div>

    <div class="section-label">Exception reason breakdown — honest, unresolved cases</div>
    <div class="breakdown">
      ${Object.entries(exceptionCounts).map(([k,v]) => `<div class="pill exception">${k}: ${v}</div>`).join('')}
    </div>

    <div class="section-label">Full audit trail</div>
    <div class="filter-row">
      <div class="filter-btn ${currentFilter==='ALL'?'active':''}" data-f="ALL">All (${records.length})</div>
      <div class="filter-btn ${currentFilter==='MATCHED'?'active':''}" data-f="MATCHED">Matched (${matched.length})</div>

      <thead>

      </thead>
      <tbody>
        ${filtered.map(r => `
          <tr>
            <td class="ref">${r.txn_ref}</td>
            <td><span class="status-badge ${r.status}">${r.status === 'MATCHED' ? r.match_type : r.exception_reason}</span></td>
            <td class="amt">${r.ledger_amount !== null ? '₹' + r.ledger_amount.toLocaleString('en-IN', {minimumFractionDigits:2}) : '—'}</td>
            <td class="amt">${r.settlement_amount !== null ? '₹' + r.settlement_amount.toLocaleString('en-IN', {minimumFractionDigits:2}) : '—'}</td>

          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  content.querySelectorAll('.filter-btn').forEach(b => {
    b.onclick = () => { currentFilter = b.dataset.f; render(); };
  });
}
