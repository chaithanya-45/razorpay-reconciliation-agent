name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check syntax
        run: >
          python -c "import py_compile, pathlib; files = sorted(list(pathlib.Path('SRC').glob('*.py')) + list(pathlib.Path('tests').glob('*.py'))); [py_compile.compile(str(f), doraise=True) for f in files]; print('Syntax OK')"
